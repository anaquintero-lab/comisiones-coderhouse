name: Actualizar listado de estudiantes Coderhouse

# Corre todos los días a las 14:00 hora Argentina. Este workflow solo
# escribe estudiantes_coderhouse.json y estudiantes_historial.json — nunca
# toca index.html — así que no importa en qué orden corra respecto de
# "Actualizar comisiones Coderhouse" ni de "Actualizar precios públicos".
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar listado de estudiantes actualizado
        env:
          CODERHOUSE_API_URL: https://api-prod.coderhouse.com/api
          CLAUDE_STUDENT_API_KEY: ${{ secrets.CLAUDE_STUDENT_API_KEY }}
          CLAUDE_FINANCE_API_KEY: ${{ secrets.CLAUDE_FINANCE_API_KEY }}
        run: python3 scripts/actualizar_estudiantes.py

      - name: Commitear y pushear si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "— git status antes de git add —"
          git status --porcelain

          git add -f estudiantes_coderhouse.json estudiantes_historial.json

          echo "— archivos en stage para el commit —"
          git diff --cached --stat

          git diff --cached --quiet || git commit -m "Actualizar listado de estudiantes (automático)"
          git push
