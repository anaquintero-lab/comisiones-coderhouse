name: Actualizar precios públicos (web)

# Scrapea los precios públicos de coderhouse.com y actualiza la
# Calculadora de cambios en index.html. A diferencia del workflow
# "Actualizar comisiones Coderhouse", este NO necesita ningún secreto: solo
# lee páginas públicas, así que corre solo, todos los días, sin configurar
# nada ni consumir tokens de ninguna API.

on:
  schedule:
    # Todos los días a las 09:00 hora Argentina (UTC-3) = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar-precios:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Scrapear precios públicos y actualizar index.html
        run: python3 scripts/scraper_precios_web.py

      - name: Commitear y pushear si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Diagnóstico: si algún día vuelve a faltar un archivo en el
          # commit, estas líneas lo muestran en el log de esta misma corrida
          # (pestaña Actions → esta corrida → este paso) en vez de tener que
          # adivinar por qué.
          echo "— git status antes de git add —"
          git status --porcelain
          if [ -f .gitignore ]; then
            echo "— .gitignore del repo —"
            cat .gitignore
          fi

          # -f (force) es la parte importante: precios_coderhouse.json e
          # index.html son archivos de datos que el repo SIEMPRE tiene que
          # trackear, así que se agregan de forma forzada aunque algún
          # .gitignore (del repo, o uno global de la cuenta/runner) los
          # esté excluyendo por error — "git add" sin -f ignora en
          # silencio (solo un aviso en el log) cualquier archivo
          # alcanzado por una regla de .gitignore, y por eso podía pasar
          # que index.html se comitee pero precios_coderhouse.json no.
          git add -f index.html precios_coderhouse.json

          echo "— archivos en stage para el commit —"
          git diff --cached --stat

          git diff --cached --quiet || git commit -m "Actualizar precios públicos (automático)"
          git push
